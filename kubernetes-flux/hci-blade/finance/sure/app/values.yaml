# https://github.com/we-promise/sure/blob/main/charts/sure/values.yaml

rails:
  env: production
  existingSecret: "sure"
  secret:
    enabled: false
  settings:
    AI_DEBUG_MODE: "false"
    AUTH_JIT_MODE: "create_and_link"
    AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED: "true"
    AUTH_LOCAL_LOGIN_ENABLED: "false"
    AUTH_PROVIDERS_SOURCE: "db"
    ONBOARDING_STATE: "open"
    REDIS_URL: "redis://valkey.cache.svc.cluster.internal:6379/3"
    SELF_HOSTED: "true"
  externalAssistant:
    enabled: false

cnpg:
  enabled: false
  cluster:
    enabled: false

redisOperator:
  enabled: false

redisSimple:
  enabled: false

ingress:
  enabled: false

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    does-not-render-without: this-label

web:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

worker:
  enabled: true
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

migrations:
  strategy: job

podSecurityContext:
  fsGroup: 65534
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault
  runAsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

writableTmp:
  enabled: true

pipelock:
  enabled: false
  replicas: 1
  mode: balanced
  trustedDomains: ["*.${DOMAIN_INTERNAL}", "*.cluster.internal"]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: ~
