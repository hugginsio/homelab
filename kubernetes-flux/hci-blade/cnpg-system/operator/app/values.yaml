# yaml-language-server: $schema=https://raw.githubusercontent.com/cloudnative-pg/charts/refs/heads/main/charts/cloudnative-pg/values.schema.json

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

podSecurityContext:
  fsGroup: 65534
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault
  runAsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

monitoring:
  grafanaDashboard:
    create: true
    labels:
      grafana: dashboard
  podMonitorEnabled: true
