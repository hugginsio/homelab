# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-pg-alpha
  namespace: flux-system
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: pg-alpha
  path: ./kubernetes-flux/hci-blade/database/pg-alpha/app
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  interval: 3h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cnpg-system-operator
    - name: secrets-system-resources
