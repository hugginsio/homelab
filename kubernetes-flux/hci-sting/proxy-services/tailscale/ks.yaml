# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app proxy-services-tailscale
  namespace: flux-system
spec:
  targetNamespace: proxy-services
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes-flux/hci-sting/proxy-services/tailscale/app
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  interval: 3h
  retryInterval: 1m
  timeout: 5m
