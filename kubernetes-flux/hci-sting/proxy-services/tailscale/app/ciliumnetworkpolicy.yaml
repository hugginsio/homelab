# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tailscale
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tailscale
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchPattern: "*.tailscale.com"
      toPorts:
        - ports:
            - port: "80"
            - port: "443"
  ingress:
    - fromEndpoints:
        - matchLabels:
            tailscale.com/managed: "true"
            tailscale.com/parent-resource-ns: proxy-services
            io.kubernetes.pod.namespace: tailscale-system
