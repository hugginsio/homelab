# https://external-secrets.io/latest/api/clustersecretstore/
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/clustersecretstore_v1.json

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ak
spec:
  provider:
    akeyless:
      akeylessGWApiURL: "https://api.akeyless.io"
      authSecretRef:
        secretRef:
          accessID:
            namespace: secrets-system
            name: ak-creds
            key: accessId
          accessType:
            namespace: secrets-system
            name: ak-creds
            key: accessType
          accessTypeParam:
            namespace: secrets-system
            name: ak-creds
            key: accessType
  conditions:
    - namespaceSelector:
        matchLabels:
          secrets.huggins.dev/ak: enable
